name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  AIRFLOW_VERSION: '2.9.1'

jobs:
  # Job 1: Lint and Code Quality
  lint:
    name: Lint and Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pylint bandit

      - name: Run flake8
        run: |
          flake8 dags/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 dags/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run black (check only)
        run: black --check dags/

      - name: Run isort (check only)
        run: isort --check-only dags/

      - name: Run bandit (security)
        run: bandit -r dags/ -ll

  # Job 2: Test DAGs
  test-dags:
    name: Test DAGs
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/requirements.txt
          pip install -r requirements-test.txt

      - name: Initialize Airflow DB
        run: |
          airflow db init

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short --junitxml=junit/test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: junit/test-results.xml

  # Job 3: Build Docker Image
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-dags
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: false
          tags: airflow-custom:${{ env.AIRFLOW_VERSION }}-python${{ env.PYTHON_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm airflow-custom:${{ env.AIRFLOW_VERSION }}-python${{ env.PYTHON_VERSION }} \
            python -c "import airflow; print(f'Airflow version: {airflow.__version__}')"

  # Job 4: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 5: Build and Push to GCR (on main branch only)
  push-to-gcr:
    name: Push to GCR
    runs-on: ubuntu-latest
    needs: [test-dags, build-docker, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker us.gcr.io

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.AIRFLOW_VERSION }}-python${{ env.PYTHON_VERSION }}-${{ github.sha }}"
          IMAGE_PATH="us.gcr.io/${{ secrets.GCP_PROJECT_ID }}/airflow-custom:${IMAGE_TAG}"

          docker build -t ${IMAGE_PATH} ./docker
          docker tag ${IMAGE_PATH} us.gcr.io/${{ secrets.GCP_PROJECT_ID }}/airflow-custom:latest

          docker push ${IMAGE_PATH}
          docker push us.gcr.io/${{ secrets.GCP_PROJECT_ID }}/airflow-custom:latest

      - name: Output image details
        run: |
          echo "Image pushed: us.gcr.io/${{ secrets.GCP_PROJECT_ID }}/airflow-custom:latest"
          echo "Git SHA: ${{ github.sha }}"

  # Job 6: Deploy to Staging (optional)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: push-to-gcr
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME }} \
            --region ${{ secrets.GKE_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy with Helm
        run: |
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

          helm upgrade --install airflow apache-airflow/airflow \
            --namespace airflow-staging \
            --create-namespace \
            --values helm-chart/values.yaml \
            --set images.airflow.tag="${{ env.AIRFLOW_VERSION }}-python${{ env.PYTHON_VERSION }}-${{ github.sha }}" \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/airflow-webserver -n airflow-staging
          kubectl rollout status deployment/airflow-scheduler -n airflow-staging
