[pytest]
# Pytest configuration for Airflow tests

# Test paths
testpaths = tests

# Python files
python_files = test_*.py

# Python classes
python_classes = Test*

# Python functions
python_functions = test_*

# Minimum Python version
minversion = 3.11

# Add current directory to Python path
pythonpath = . dags

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests (deselect with '-m "not slow"')
    dag: DAG-related tests
    operator: Operator-related tests
    security: Security-related tests
    performance: Performance-related tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    -ra

# Coverage options (if using pytest-cov)
# Uncomment when pytest-cov is installed
# addopts =
#     --cov=dags
#     --cov-report=html
#     --cov-report=term-missing
#     --cov-fail-under=80

# Ignore paths
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .venv
    venv

# Log options
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (optional)
# timeout = 300

# Parallel execution (requires pytest-xdist)
# addopts = -n auto
